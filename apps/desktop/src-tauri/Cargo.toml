[package]
name = "wordforge-desktop"
description = "Wordforge 桌面應用程式（Tauri）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "wordforge_desktop_lib"
# Tauri 在行動平台需要 staticlib/cdylib，桌面用 rlib
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wordforge-core = { workspace = true }
wordforge-db = { workspace = true }
wordforge-dict = { workspace = true }
wordforge-llm = { workspace = true }

sqlx = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
