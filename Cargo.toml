[workspace]
resolver = "3"
members = [
    "crates/wordforge-cli",
    "crates/wordforge-core",
    "crates/wordforge-db",
    "crates/wordforge-dict",
    "crates/wordforge-import",
    "crates/wordforge-llm",
    "crates/wordforge-practice",
    "crates/wordforge-tts",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/wordforge-cli",
    "crates/wordforge-core",
    "crates/wordforge-db",
    "crates/wordforge-dict",
    "crates/wordforge-import",
    "crates/wordforge-llm",
    "crates/wordforge-practice",
    "crates/wordforge-tts",
]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/guanwei6238/wordforge"
authors = ["Wordforge Contributors"]

[workspace.dependencies]
wordforge-cli = { path = "crates/wordforge-cli" }
wordforge-core = { path = "crates/wordforge-core" }
wordforge-db = { path = "crates/wordforge-db" }
wordforge-dict = { path = "crates/wordforge-dict" }
wordforge-import = { path = "crates/wordforge-import" }
wordforge-llm = { path = "crates/wordforge-llm" }
wordforge-practice = { path = "crates/wordforge-practice" }
wordforge-tts = { path = "crates/wordforge-tts" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
# 教材匯入：EPUB 是 zip + XHTML，PDF 需要抽字層
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
pdf-extract = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
